name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        type: choice
        options: [val, prd]
        required: true
      sha:
        description: Commit SHA already deployed to dev
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/chjort/bookshop

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          docker build --build-arg APP_VERSION=${{ github.sha }} -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ github.sha }}

  dev:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: dev, url: "https://probooks.dev.nygaardsvej41.dk" }
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - if: env.HOOK == ''
        run: echo "::notice::RENDER_DEPLOY_HOOK not set for dev; skipping deploy until Render is set up (#4)."
      - uses: actions/checkout@v4
        if: env.HOOK != ''
      - if: env.HOOK != ''
        run: scripts/deploy.sh "${{ secrets.RENDER_DEPLOY_HOOK }}" "$IMAGE:${{ github.sha }}" https://probooks.dev.nygaardsvej41.dk ${{ github.sha }}
      - name: Smoke test dev
        if: env.HOOK != ''
        run: python3 scripts/smoke_test.py https://probooks.dev.nygaardsvej41.dk ${{ github.sha }} dev

  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: { group: "promote-${{ inputs.env }}", cancel-in-progress: false }
    environment:
      name: ${{ inputs.env }}
      url: ${{ inputs.env == 'prd' && 'https://probooks.nygaardsvej41.dk' || 'https://probooks.val.nygaardsvej41.dk' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check SHA is on main
        run: git merge-base --is-ancestor ${{ inputs.sha }} origin/main
      - name: Deploy and smoke test
        run: |
          host=${{ inputs.env == 'prd' && 'https://probooks.nygaardsvej41.dk' || 'https://probooks.val.nygaardsvej41.dk' }}
          scripts/deploy.sh "${{ secrets.RENDER_DEPLOY_HOOK }}" "$IMAGE:${{ inputs.sha }}" "$host" ${{ inputs.sha }}
          python3 scripts/smoke_test.py "$host" ${{ inputs.sha }} ${{ inputs.env }}
      - name: Tag release
        if: inputs.env == 'prd'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          last=$(git tag -l 'v*' | sed 's/^v//' | sort -n | tail -1)
          next="v$(( ${last:-0} + 1 ))"
          git tag "$next" ${{ inputs.sha }} && git push origin "$next"
          gh release create "$next" --target ${{ inputs.sha }} --generate-notes
